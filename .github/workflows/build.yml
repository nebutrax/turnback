name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PW_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Strip whitespace / stray characters picked up when pasting secrets.
            printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
            PW=$(printf '%s' "$KEYSTORE_PW_RAW" | tr -cd 'A-Za-z0-9')
            echo "::add-mask::$PW"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias turnback > /dev/null \
              && echo "Keystore OK" || { echo "::error::Keystore/password mismatch"; exit 1; }
          else
            echo "::warning::No KEYSTORE_B64 secret — building with debug key"
          fi

      - name: Build release APK
        env:
          KEY_ALIAS: turnback
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TurnBack-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TurnBack-apk
          path: TurnBack-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: TurnBack 0.1.${{ github.run_number }}
          files: TurnBack-*.apk
          make_latest: true
